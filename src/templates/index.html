<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Scale Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            box-shadow: 0 0 10px var(--text-secondary);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .status-dot.authenticated {
            background-color: var(--success);
            box-shadow: 0 0 15px var(--success);
        }

        .status-dot.mfa {
            background-color: var(--warning);
            box-shadow: 0 0 15px var(--warning);
            animation: pulse 1.5s infinite;
        }

        .status-dot.error {
            background-color: var(--danger);
            box-shadow: 0 0 15px var(--danger);
        }

        .status-text {
            font-weight: 600;
            font-size: 1.2rem;
        }

        .status-subtext {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }
        
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .mfa-container {
            display: none;
            margin-top: 1.5rem;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            display: flex;
            gap: 1rem;
        }

        .input-group input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .input-group input:focus {
            border-color: var(--accent-primary);
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .logs-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
        }

        .logs-container::-webkit-scrollbar {
            width: 8px;
        }

        .logs-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .logs-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .log-item {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.3s ease-in;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .log-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .log-status {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .log-status.Success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .log-status.Failed {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .log-details {
            font-family: monospace;
            font-size: 0.85rem;
            color: #d1d5db;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem;
            border-radius: 8px;
            word-break: break-all;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-panel">
            <div class="header">
                <h1>Garmin Scale Sync</h1>
                <p>Bridge your smart scale data directly to Garmin Connect</p>
            </div>

            <div class="status-container">
                <div class="status-indicator">
                    <div id="status-dot" class="status-dot"></div>
                    <div>
                        <div id="status-text" class="status-text">Checking status...</div>
                        <div id="status-subtext" class="status-subtext">Connecting to bridge</div>
                    </div>
                </div>
                <button id="login-btn" class="btn" onclick="initiateLogin()">Login</button>
            </div>

            <div id="mfa-section" class="mfa-container">
                <p style="margin-bottom: 0.75rem; color: var(--warning); font-weight: 500;">Multi-Factor Authentication Required</p>
                <div class="input-group">
                    <input type="text" id="mfa-code" placeholder="Enter 6-digit MFA Code" maxlength="6" autocomplete="off">
                    <button id="submit-mfa-btn" class="btn" onclick="submitMFA()">Submit</button>
                </div>
            </div>
        </div>

        <div class="glass-panel">
            <div class="logs-header">
                <h2>Recent Sync Logs</h2>
                <button class="btn btn-outline" onclick="clearLogs()">Clear Logs</button>
            </div>
            <div id="logs-container" class="logs-container">
                <div style="text-align: center; color: var(--text-secondary); padding: 2rem;">Loading logs...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toast-msg">Notification</span>
    </div>

    <script>
        // Use basic auth credentials configured in env for the API calls
        // In a real scenario, this UI would prompt for credentials or be served behind an auth proxy.
        // For simplicity in this local dashboard, we prompt the user if basic auth is needed.
        
        let basicAuthHeader = null;

        function getAuthHeaders() {
            if (!basicAuthHeader) {
                // To keep it simple, we don't automatically prompt unless a 401 is received.
                return {};
            }
            return { 'Authorization': basicAuthHeader };
        }

        async function fetchWithAuth(url, options = {}) {
            let res = await fetch(url, {
                ...options,
                headers: {
                    ...options.headers,
                    ...getAuthHeaders()
                }
            });

            if (res.status === 401) {
                const username = prompt("Enter Basic Auth Username:");
                const password = prompt("Enter Basic Auth Password:");
                if (username && password) {
                    basicAuthHeader = 'Basic ' + btoa(unescape(encodeURIComponent(username + ':' + password)));
                    // Retry request
                    res = await fetch(url, {
                        ...options,
                        headers: {
                            ...options.headers,
                            ...getAuthHeaders()
                        }
                    });
                }
            }
            return res;
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.className = 'toast show';
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        async function checkStatus() {
            try {
                const response = await fetchWithAuth('/v1/auth/status');
                if (!response.ok) return;
                
                const data = await response.json();
                updateStatusUI(data);
            } catch (error) {
                console.error("Status check failed:", error);
                document.getElementById('status-text').textContent = "Connection Error";
                document.getElementById('status-subtext').textContent = "Cannot reach bridge API";
                document.getElementById('status-dot').className = "status-dot error";
            }
        }

        function updateStatusUI(data) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const subtext = document.getElementById('status-subtext');
            const loginBtn = document.getElementById('login-btn');
            const mfaSection = document.getElementById('mfa-section');

            text.textContent = data.status.charAt(0).toUpperCase() + data.status.slice(1).replace('_', ' ');
            subtext.textContent = data.message;
            
            // Reset state
            dot.className = "status-dot";
            mfaSection.style.display = "none";
            loginBtn.style.display = "block";
            loginBtn.disabled = false;

            if (data.status === "authenticated") {
                dot.className = "status-dot authenticated";
                loginBtn.style.display = "none";
            } else if (data.status === "mfa_required") {
                dot.className = "status-dot mfa";
                loginBtn.style.display = "none";
                mfaSection.style.display = "block";
            } else if (data.status === "checking") {
                dot.className = "status-dot";
                loginBtn.disabled = true;
                loginBtn.textContent = "Connecting...";
            } else {
                dot.className = "status-dot error";
                loginBtn.textContent = "Login";
            }
        }

        async function initiateLogin() {
            try {
                const response = await fetchWithAuth('/v1/auth/login', { method: 'POST' });
                const data = await response.json();
                if (response.ok) {
                    showToast(data.message);
                } else {
                    const errMsg = data.detail || data.message || "Failed to initiate login";
                    showToast(errMsg, "error");
                }
                checkStatus();
            } catch (error) {
                showToast("Failed to initiate login", "error");
            }
        }

        async function submitMFA() {
            const code = document.getElementById('mfa-code').value.trim();
            if (!code || code.length < 6) {
                showToast("Please enter a valid 6-digit code");
                return;
            }

            try {
                const response = await fetchWithAuth('/v1/auth/mfa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                
                const data = await response.json();
                if (response.ok) {
                    showToast(data.message);
                    document.getElementById('mfa-code').value = '';
                } else {
                    const errMsg = data.detail || data.message || "Failed to submit MFA code";
                    showToast(errMsg, "error");
                }
                checkStatus();
            } catch (error) {
                showToast("Failed to submit MFA code", "error");
            }
        }

        async function loadLogs() {
            try {
                const response = await fetchWithAuth('/v1/logs');
                if (!response.ok) return;
                
                const logs = await response.json();
                renderLogs(logs);
            } catch (error) {
                console.error("Failed to load logs:", error);
            }
        }

        function renderLogs(logs) {
            const container = document.getElementById('logs-container');
            
            if (!logs || logs.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 2rem;">No logs found.</div>';
                return;
            }

            container.innerHTML = logs.map(log => {
                const date = new Date(log.timestamp).toLocaleString();
                const statusClass = log.status === 'Success' ? 'Success' : 'Failed';
                let details = `Payload: ${JSON.stringify(log.payload)}`;
                if (log.error) {
                    details += `\nError: ${log.error} (HTTP ${log.http_code})`;
                }

                return `
                    <div class="log-item">
                        <div class="log-time">${date}</div>
                        <div class="log-status ${statusClass}">${log.status}</div>
                        <div class="log-details">${details}</div>
                    </div>
                `;
            }).join('');
        }

        async function clearLogs() {
            if (!confirm("Are you sure you want to clear all logs?")) return;

            try {
                const response = await fetchWithAuth('/v1/logs/clear', { method: 'POST' });
                if (response.ok) {
                    showToast("Logs cleared successfully");
                    loadLogs();
                }
            } catch (error) {
                showToast("Failed to clear logs", "error");
            }
        }

        // Poll status and logs periodically
        setInterval(checkStatus, 3000);
        setInterval(loadLogs, 5000);
        
        // Initial load
        setTimeout(() => {
            checkStatus();
            loadLogs();
        }, 500);
    </script>
</body>
</html>
