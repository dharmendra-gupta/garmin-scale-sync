name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ca-certificates curl
        
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
        GARMIN_EMAIL: "test@example.com"
        GARMIN_PASSWORD: "password"
        API_BEARER_TOKEN: "secret"
        API_BASIC_AUTH_PASSWORD: "admin"
      run: |
        pytest src/tests/ -v

    - name: Notify Repository Owner to Merge
      if: github.event_name == 'pull_request' && success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **All automated tests passed successfully in CI!**\n\n@${context.repo.owner} (Repository Owner), this pull request has been fully validated and is ready to be merged.`
          })
