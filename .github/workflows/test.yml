name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build test image (with layer cache)
      uses: docker/build-push-action@v5
      with:
        context: .
        target: test          # runtime stage carries no pytest — see Dockerfile
        push: false
        load: true
        tags: garmin-scale-sync:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run pytest inside Docker
      run: |
        docker run --rm \
          -e GARMIN_EMAIL=test@example.com \
          -e GARMIN_PASSWORD=password \
          -e API_BEARER_TOKEN=secret \
          -e API_BASIC_AUTH_PASSWORD=admin \
          garmin-scale-sync:ci \
          pytest src/tests/ -n auto -v

    - name: Notify Repository Owner to Merge
      if: github.event_name == 'pull_request' && success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **All automated tests passed successfully in CI!**\n\n@${context.repo.owner} (Repository Owner), this pull request has been fully validated and is ready to be merged.`
          })
